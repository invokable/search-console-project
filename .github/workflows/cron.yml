name: cron

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: '0 0 * * *' #UTC

jobs:
  cron:
    name: cron
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: latest
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev -q

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Command
        run: php artisan sc:report
        env:
          MAIL_MAILER: 'resend'
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_TO_ADDRESS: ${{ secrets.MAIL_TO_ADDRESS }}
          MAIL_TO_NAME: ${{ secrets.MAIL_TO_NAME }}
          GOOGLE_SERVICE_ENABLED: true
          GOOGLE_SERVICE_ACCOUNT_JSON_LOCATION: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_LOCATION }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
